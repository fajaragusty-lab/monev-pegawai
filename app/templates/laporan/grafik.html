{% extends "base.html" %}
{% block title %}Grafik KPI{% endblock %}
{% block content %}
<h3 class="mb-4">Grafik KPI</h3>

<form method="GET" class="row g-2 mb-3">
    <div class="col-auto">
        <select name="periode_id" class="form-select" onchange="this.form.submit()">
            {% for p in periode_list %}
            <option value="{{ p.id }}" {% if periode_id == p.id %}selected{% endif %}>{{ p.periode }}</option>
            {% endfor %}
        </select>
    </div>
</form>

<div class="row g-3">
    <div class="col-md-6">
        <div class="card card-stat p-3">
            <h6 class="text-muted">Grafik Batang Nilai KPI per Pegawai</h6>
            <canvas id="barChart" height="220"></canvas>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card card-stat p-3">
            <h6 class="text-muted">Grafik Garis Nilai KPI per Pegawai</h6>
            <canvas id="lineChart" height="220"></canvas>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
const labels = {{ labels | tojson }};
const values = {{ values | tojson }};

new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{
            label: 'Nilai KPI',
            data: values,
            backgroundColor: '#0d6efd'
        }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
});

new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
        labels: labels,
        datasets: [{
            label: 'Nilai KPI',
            data: values,
            borderColor: '#198754',
            backgroundColor: 'rgba(25,135,84,0.15)',
            fill: true,
            tension: 0.3
        }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
});
</script>
{% endblock %}
