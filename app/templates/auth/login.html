{% extends "base.html" %}
{% block title %}Login - Sistem Penilaian Kinerja{% endblock %}
{% block guest_content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow" style="width: 400px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-check" style="font-size: 2.5rem; color: #0d6efd;"></i>
                <h4 class="mt-2 mb-0">Monev Pajak</h4>
                <p class="text-muted small">Sistem Penilaian Kinerja Petugas Penagihan Pajak</p>
            </div>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <hr>
            <div class="small text-muted">
                <strong>Demo credentials:</strong><br>
                Admin: <code>admin</code> / <code>admin123</code><br>
                Petugas: <code>petugas1</code> / <code>petugas123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
