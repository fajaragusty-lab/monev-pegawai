{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Buat' }} Penugasan{% endblock %}
{% block content %}
<h3 class="mb-4">{{ 'Edit' if item else 'Buat' }} Penugasan</h3>
<div class="card card-stat p-4" style="max-width: 700px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Pegawai</label>
            <select name="pegawai_id" class="form-select" required>
                <option value="">- Pilih Pegawai -</option>
                {% for p in pegawai_list %}
                <option value="{{ p.id }}" {% if item and item.pegawai_id == p.id %}selected{% endif %}>{{ p.nama }} ({{ p.nip }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Wajib Pajak</label>
            <select name="wajib_pajak_id" class="form-select" required>
                <option value="">- Pilih Wajib Pajak -</option>
                {% for w in wajib_pajak_list %}
                <option value="{{ w.id }}" {% if item and item.wajib_pajak_id == w.id %}selected{% endif %}>{{ w.nama }} ({{ w.npwp }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Jenis Pekerjaan</label>
            <select name="jenis_pekerjaan_id" class="form-select" required>
                <option value="">- Pilih Jenis Pekerjaan -</option>
                {% for j in jenis_pekerjaan_list %}
                <option value="{{ j.id }}" {% if item and item.jenis_pekerjaan_id == j.id %}selected{% endif %}>{{ j.nama }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Periode</label>
            <select name="periode_id" class="form-select" required>
                <option value="">- Pilih Periode -</option>
                {% for pr in periode_list %}
                <option value="{{ pr.id }}" {% if item and item.periode_id == pr.id %}selected{% endif %}>{{ pr.periode }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label">Target Jumlah</label>
                <input type="number" name="target_jumlah" class="form-control" value="{{ item.target_jumlah if item else 1 }}" required>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">Target Nominal (Rp)</label>
                <input type="number" step="0.01" name="target_nominal" class="form-control" value="{{ item.target_nominal if item else 0 }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Deadline</label>
            <input type="datetime-local" name="deadline" class="form-control"
                   value="{{ item.deadline.strftime('%Y-%m-%dT%H:%M') if item else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                {% for s in ['draft', 'active', 'completed', 'cancelled'] %}
                <option value="{{ s }}" {% if item and item.status == s %}selected{% endif %}>{{ s|capitalize }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Catatan</label>
            <textarea name="catatan" class="form-control" rows="2">{{ item.catatan if item else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Simpan</button>
        <a href="{{ url_for('penugasan.index') }}" class="btn btn-secondary">Batal</a>
    </form>
</div>
{% endblock %}
