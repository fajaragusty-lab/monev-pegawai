{% extends "base.html" %}
{% block title %}Wilayah{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Data Wilayah</h3>
    <a href="{{ url_for('master.wilayah_create') }}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Tambah Wilayah</a>
</div>
<div class="card card-stat">
    <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
            <thead>
                <tr><th>#</th><th>Kode</th><th>Nama Wilayah</th><th class="text-end">Aksi</th></tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ item.kode }}</td>
                    <td>{{ item.nama_wilayah }}</td>
                    <td class="text-end">
                        <a href="{{ url_for('master.wilayah_edit', item_id=item.id) }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                        <form action="{{ url_for('master.wilayah_delete', item_id=item.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Hapus wilayah ini?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center text-muted py-4">Belum ada data wilayah.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
