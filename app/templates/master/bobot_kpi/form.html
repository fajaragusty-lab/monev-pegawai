{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Tambah' }} Bobot KPI{% endblock %}
{% block content %}
<h3 class="mb-4">{{ 'Edit' if item else 'Tambah' }} Bobot KPI</h3>
<div class="card card-stat p-4" style="max-width: 600px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nama Indikator</label>
            <input type="text" name="nama_indikator" class="form-control" value="{{ item.nama_indikator if item else '' }}" required
                   list="indikator-options">
            <datalist id="indikator-options">
                <option value="Target">
                <option value="Realisasi">
                <option value="Penagihan Berhasil">
                <option value="Verval">
                <option value="GPS Valid">
                <option value="Ketepatan Waktu">
                <option value="Kelengkapan Dokumen">
            </datalist>
        </div>
        <div class="mb-3">
            <label class="form-label">Bobot (%)</label>
            <input type="number" step="0.01" min="0" max="100" name="bobot" class="form-control" value="{{ item.bobot if item else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Keterangan</label>
            <textarea name="keterangan" class="form-control" rows="2">{{ item.keterangan if item else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Simpan</button>
        <a href="{{ url_for('master.bobot_kpi_list') }}" class="btn btn-secondary">Batal</a>
    </form>
</div>
{% endblock %}
